# Executable semantic certification contracts.
#
# Every mandatory release capability is dispatched in its own fresh process.
# The command imports and instantiates the owner named by capability_manifest,
# executes a real fixture behavior, computes a non-empty semantic metric, and
# writes nonce-bound evidence to KG_CERT_EVIDENCE_PATH.  The certifier has no
# final-run fake/stub transport switch: model, linker, Ollama, Neo4j, Memgraph,
# and Ladybug scenarios contact their real configured backends.
version: 2

x-semantic-certifier: &semantic-certifier
  profiles: [darwin-arm64, linux-cpu, linux-cuda]
  command: [.venv/bin/python, scripts/certify_capability.py]
  timeout_seconds: 900

x-darwin-semantic-certifier: &darwin-semantic-certifier
  profiles: [darwin-arm64]
  command: [.venv/bin/python, scripts/certify_capability.py]
  timeout_seconds: 900

capabilities:

evaluation:
  # This is the executable selection control: all benchmark candidates are run,
  # even when the CLI leaves --techniques at its "applicable" default.
  force_all_techniques: true
  # Gold data is dataset-specific. Leaving it unset is deliberately fail-closed:
  # reports can be smoke/ranking reports, but cannot pass publication hard gates.
  # Set this to a reviewed GoldDatasetManifest for a publishable evaluation.
  gold_dataset_path: null
  # Record observed runtime, throughput, memory, and graph-write measurements.
  # Deterministic fixed values are only useful in unit-test fixtures.
  deterministic_runtime: false

applicability_threshold: 0.40

weights:
  accuracy: 0.25
  validation: 0.20
  coverage: 0.15
  entity_resolution: 0.10
  retrieval: 0.10
  scalability: 0.08
  cost_efficiency: 0.07
  maintainability: 0.05

penalties:
  unsupported_extraction: 0.25
  schema_violation: 0.20
  latency: 0.10
  human_review: 0.05

production_thresholds:
  evidence_coverage: 0.95
  schema_validity: 0.95
  unsupported_extraction_rate: 0.02
  validation_failure_rate: 0.05

# A candidate may still be ranked when a gate fails, but it is not marked as
# publication-eligible. Set require_gold_dataset to false only for smoke tests.
hard_gates:
  require_gold_dataset: true
  maximum_dangling_edge_rate: 0.0
  maximum_duplicate_edge_rate: 0.0
  minimum_evidence_coverage: 0.95
  maximum_validation_failure_rate: 0.05
  maximum_false_merge_rate: 0.02
  minimum_entity_f1: 0.80
  minimum_span_f1: 0.80
  minimum_relation_f1: 0.80
  minimum_triple_exact_match: 0.80
  minimum_pairwise_er_recall: 0.80
  minimum_er_record_id_coverage: 1.0
  minimum_retrieval_recall_at_k: 0.70
  minimum_retrieval_prediction_completeness: 1.0
  # Schema quality is a hard requirement in the complete profile.
  enforce_schema_quality_gates: true
  maximum_orphan_rate: 0.05
  maximum_duplicate_node_rate: 0.0
  maximum_categorical_duplication_rate: 0.0
  maximum_schema_consistency_violation_count: 0.0

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3:1.7b-q4_K_M
  temperature: 0
  structured_output: true

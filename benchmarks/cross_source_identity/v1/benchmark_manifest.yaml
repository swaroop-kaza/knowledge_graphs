metadata:
  benchmark_status: gold-candidate
  maintainer: swaroop-kaza
  annotation_method: Human-authored synthetic clusters with explicit hard-negative review.
  task: cross_source_entity_resolution
  synthetic: true
  source_files:
    - crm.csv
    - billing.csv
    - support.csv
  record_count: 12
  source_count: 3
  gold_pair_count: 8
  leakage_policy: No gold cluster identifier is present in source files.
  identity_policy: >-
    Person names alone are not identifiers. Trusted identifiers are included as
    observable source attributes but the published name-based baselines do not use them.
  hard_gates:
    minimum_pairwise_precision: 0.98
    maximum_false_merge_rate: 0.02
    minimum_evidence_coverage: 1.0
    require_source_order_invariance: true
  limitations:
    - Tiny synthetic correctness fixture; it is not representative of production scale.
    - It evaluates clustering only, not field survivorship or temporal updates.
    - The trusted-identifier reference is deliberately easy and is not independent evidence that a learned resolver generalizes.

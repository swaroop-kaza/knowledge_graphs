name: Mandatory certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  substrate:
    name: Static certification contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
      - name: Install the immutable dependency graph
        run: uv sync --frozen --all-groups
      - name: Validate mandatory manifests and certification APIs
        run: |
          uv run python -m unittest \
            tests.test_capability_manifest \
            tests.test_certification_substrate \
            tests.test_doctor_cli -v

  certify:
    name: ${{ matrix.profile }} / locked-artifact hard pass
    needs: substrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-cpu
            runner: '"ubuntu-latest"'
          - profile: darwin-arm64
            runner: '["self-hosted","macOS","ARM64","kg-certification"]'
          - profile: linux-cuda
            runner: '["self-hosted","Linux","X64","CUDA","kg-certification"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 180
    env:
      KG_CERT_PROFILE: ${{ matrix.profile }}
      OLLAMA_MODEL: qwen3:1.7b-q4_K_M
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: certification
      MEMGRAPH_URI: bolt://localhost:7688
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
      - name: Bootstrap exact Python artifacts
        run: uv sync --frozen --all-groups
      - name: Bootstrap digest-pinned services
        run: docker compose -f certification/services.lock.yaml up -d
      - name: Hydrate exact model artifacts and model digests
        run: |
          uv run python scripts/hydrate_models.py --profile "${KG_CERT_PROFILE}"
          uv run python scripts/wait_for_services.py --profile "${KG_CERT_PROFILE}"
      - name: Disconnect model and dependency registries
        run: |
          echo "UV_OFFLINE=1" >> "$GITHUB_ENV"
          echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
          echo "TRANSFORMERS_OFFLINE=1" >> "$GITHUB_ENV"
      - name: Execute every mandatory capability with fresh evidence
        run: |
          make certify \
            CERT_PROFILE="${KG_CERT_PROFILE}" \
            CERT_EXECUTION_REPORT="certification/execution-report-${KG_CERT_PROFILE}.yaml"
      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-${{ matrix.profile }}
          path: |
            certification/execution-report-${{ matrix.profile }}.yaml
            reports/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Build and inspect release artifacts
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
      - run: uv sync --frozen --all-groups
      - run: uv run python -m build
      - run: uv run python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

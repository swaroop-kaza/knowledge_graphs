[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-construction"
version = "0.1.0"
description = "Evidence-grounded structured and unstructured knowledge graph construction with duplicate-resistant identity, semantic assertions, and graph-quality evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Swaroop Kaza" }]
keywords = [
    "knowledge-graphs",
    "data-to-kg",
    "graph-rag",
    "rdf",
    "shacl",
    "neo4j",
    "entity-resolution",
    "information-extraction",
    "data-quality",
    "record-linkage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Every product dependency is required. Platform markers express mutually
# exclusive mandatory implementations, not optional features: Apple Silicon must
# install MLX/MLX-LM, while every platform installs the Torch stack.
dependencies = [
    # Core contract, parsing, and RDF/SHACL
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "certifi>=2025.1.31",
    "jsonpath-ng>=1.7,<2",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "pypdf>=6.0",
    "rapidfuzz>=3.9",
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "pyld>=2.0,<4",
    "huggingface-hub>=0.27,<2",
    "pandas>=2.2,<4",
    "pyarrow>=17,<26",
    # Graph stores and analytics
    "networkx>=3.3,<4",
    "neo4j>=5.20,<7",
    "ladybug>=0.16.1,<0.20",
    "numpy>=1.26,<3",
    "igraph>=0.11,<2",
    "leidenalg>=0.10,<1",
    # Entity/relation extraction models
    "gliner>=0.2.16,<0.3",
    "transformers>=4.51.3,<5.16",
    "torch>=2.2,<3",
    "spacy>=3.7,<4",
    "mlx>=0.25,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.22,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # LLM provider integration
    "langchain-ollama>=0.2.0,<2",
    "langchain-core>=0.3.0,<2",
    "langchain-neo4j>=0.4.0,<1",
    # Entity linking and deduplication
    "sentence-transformers>=3.0,<7",
    "datasketch>=1.6,<3",
    "splink>=4.0,<5",
    "dedupe>=3.0,<4",
    # Graph machine learning
    "torch-geometric>=2.5,<3",
    "pykeen>=1.10,<2",
]

# Tooling groups (PEP 735). All four are part of the default repository hard pass:
# ``uv sync --frozen`` installs them and certification runs under them.
[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "twine>=5.0",
    "types-PyYAML>=6.0",
    "vulture>=2.11",
]
notebook = ["jupyter>=1.1", "ipykernel>=6.29", "nbformat>=5.10"]
benchmark = [{ include-group = "dev" }]
evaluation = [{ include-group = "dev" }]
all = [
    { include-group = "dev" },
    { include-group = "notebook" },
    { include-group = "benchmark" },
    { include-group = "evaluation" },
]

[project.urls]
Homepage = "https://github.com/swaroop-kaza/knowledge_graphs"
Repository = "https://github.com/swaroop-kaza/knowledge_graphs"
Documentation = "https://github.com/swaroop-kaza/knowledge_graphs/tree/main/docs"
Research = "https://github.com/swaroop-kaza/knowledge_graphs/tree/main/research"
Issues = "https://github.com/swaroop-kaza/knowledge_graphs/issues"

[project.scripts]
kg-construction = "kg_construction.interfaces.cli.construct:main"
kg-construction-research = "kg_construction.interfaces.cli.benchmark:main"
# Compatibility alias for the former research command name.
kg-construction-benchmark = "kg_construction.interfaces.cli.benchmark:main"
kg-construction-replay-deadletters = "kg_construction.interfaces.cli.replay_dead_letters:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kg_construction = [
    "py.typed",
    "resources/*.yaml",
    "resources/*.json",
    "resources/*.env",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_site_packages = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
